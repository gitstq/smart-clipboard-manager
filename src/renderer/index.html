<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
  <title>Smart Clipboard Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Title Bar -->
    <div class="title-bar">
      <div class="title-bar-content">
        <span class="app-icon">📋</span>
        <span class="app-title" data-i18n="app.title">Smart Clipboard Manager</span>
      </div>
      <div class="title-bar-controls">
        <button class="btn-icon" id="btn-minimize" title="Minimize">−</button>
        <button class="btn-icon" id="btn-close" title="Close">×</button>
      </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" data-i18n-placeholder="search.placeholder" placeholder="搜索剪贴板历史...">
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section">
            <div class="nav-item active" data-filter="all">
              <span class="nav-icon">📋</span>
              <span class="nav-label" data-i18n="nav.all">全部项目</span>
              <span class="nav-count" id="count-all">0</span>
            </div>
            <div class="nav-item" data-filter="favorite">
              <span class="nav-icon">⭐</span>
              <span class="nav-label" data-i18n="nav.favorites">收藏夹</span>
              <span class="nav-count" id="count-favorites">0</span>
            </div>
          </div>

          <div class="nav-section">
            <div class="nav-section-title" data-i18n="nav.types">类型筛选</div>
            <div class="nav-item" data-filter="type" data-type="text">
              <span class="nav-icon">📝</span>
              <span class="nav-label" data-i18n="type.text">文本</span>
            </div>
            <div class="nav-item" data-filter="type" data-type="url">
              <span class="nav-icon">🔗</span>
              <span class="nav-label" data-i18n="type.url">链接</span>
            </div>
            <div class="nav-item" data-filter="type" data-type="email">
              <span class="nav-icon">📧</span>
              <span class="nav-label" data-i18n="type.email">邮箱</span>
            </div>
            <div class="nav-item" data-filter="type" data-type="code">
              <span class="nav-icon">💻</span>
              <span class="nav-label" data-i18n="type.code">代码</span>
            </div>
            <div class="nav-item" data-filter="type" data-type="color">
              <span class="nav-icon">🎨</span>
              <span class="nav-label" data-i18n="type.color">颜色</span>
            </div>
          </div>
        </nav>

        <div class="sidebar-footer">
          <button class="btn-text" id="btn-settings">
            <span>⚙️</span>
            <span data-i18n="settings.title">设置</span>
          </button>
          <button class="btn-text" id="btn-stats">
            <span>📊</span>
            <span data-i18n="stats.title">统计</span>
          </button>
        </div>
      </aside>

      <!-- Content Area -->
      <main class="content">
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar-left">
            <h2 class="page-title" data-i18n="history.title">剪贴板历史</h2>
            <span class="result-count" id="result-count"></span>
          </div>
          <div class="toolbar-right">
            <button class="btn-secondary" id="btn-clear">
              <span>🗑️</span>
              <span data-i18n="action.clear">清空历史</span>
            </button>
          </div>
        </div>

        <!-- Clipboard List -->
        <div class="clipboard-list" id="clipboard-list">
          <!-- Items will be rendered here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display: none;">
          <div class="empty-icon">📋</div>
          <h3 data-i18n="empty.title">暂无剪贴板记录</h3>
          <p data-i18n="empty.description">复制一些内容，它将自动显示在这里</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settings-modal" style="display: none;">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="settings.title">设置</h3>
        <button class="btn-icon" id="btn-close-settings">×</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h4 data-i18n="settings.general">常规设置</h4>
          <div class="setting-item">
            <label data-i18n="settings.maxItems">最大历史记录数</label>
            <input type="number" id="setting-max-items" min="100" max="10000" value="1000">
          </div>
          <div class="setting-item">
            <label data-i18n="settings.autoCleanup">自动清理天数</label>
            <input type="number" id="setting-auto-cleanup" min="1" max="365" value="30">
          </div>
          <div class="setting-item">
            <label data-i18n="settings.hotkey">全局快捷键</label>
            <input type="text" id="setting-hotkey" value="Ctrl+Shift+V" readonly>
          </div>
        </div>
        <div class="settings-section">
          <h4 data-i18n="settings.appearance">外观</h4>
          <div class="setting-item">
            <label data-i18n="settings.theme">主题</label>
            <select id="setting-theme">
              <option value="system" data-i18n="theme.system">跟随系统</option>
              <option value="light" data-i18n="theme.light">浅色</option>
              <option value="dark" data-i18n="theme.dark">深色</option>
            </select>
          </div>
          <div class="setting-item">
            <label data-i18n="settings.language">语言</label>
            <select id="setting-language">
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
        <div class="settings-section">
          <h4 data-i18n="settings.notifications">通知</h4>
          <div class="setting-item checkbox">
            <input type="checkbox" id="setting-notifications" checked>
            <label for="setting-notifications" data-i18n="settings.showNotifications">显示复制通知</label>
          </div>
          <div class="setting-item checkbox">
            <input type="checkbox" id="setting-startup" checked>
            <label for="setting-startup" data-i18n="settings.startup">开机启动</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="btn-cancel-settings" data-i18n="action.cancel">取消</button>
        <button class="btn-primary" id="btn-save-settings" data-i18n="action.save">保存</button>
      </div>
    </div>
  </div>

  <!-- Stats Modal -->
  <div class="modal" id="stats-modal" style="display: none;">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="stats.title">使用统计</h3>
        <button class="btn-icon" id="btn-close-stats">×</button>
      </div>
      <div class="modal-body">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label" data-i18n="stats.totalItems">总记录数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-favorites">0</div>
            <div class="stat-label" data-i18n="stats.favorites">收藏数</div>
          </div>
        </div>
        <div class="stats-chart">
          <h4 data-i18n="stats.byType">按类型分布</h4>
          <div class="chart-container" id="type-chart">
            <!-- Chart will be rendered here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
